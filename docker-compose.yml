version: '3.8'
services:
  backend:
    container_name: backend_container
    restart: always
    pull_policy: build
    build:
      context: ./server
      dockerfile: Dockerfile
    networks:
      - app  
    environment:
      - MYSQL_HOST=mysqldb
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=demonstrator
      - MONGO_HOST=mongodb_container
      - MONGO_DATABASE=chatgpt
      - KEYCLOAK_URL=http://keycloak:8080/keycloak/
      - KEYCLOAK_REALM=kinrw
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
      - mysqldb

  frontend:
    container_name: frontend_container
    restart: always
    pull_policy: build
    environment:
      - REACT_BACKEND_API_URL=http://backend:4000
      - REACT_APP_KEYCLOAK_URL=http://localhost:80/keycloak/
      - REACT_APP_KEYCLOAK_REALM=kinrw
      - REACT_APP_KEYCLOAK_CLIENTID=kinrw
    networks:
      - app
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file:
      - ./client/.env
    depends_on:
      - backend

  mysqldb:
    container_name: mysqldb_container
    image: mysql:8.0
    restart: always
    networks:
      - app
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demonstrator
      MYSQL_SQL_MODE: "NO_ENGINE_SUBSTITUTION"
    command: --sql-mode="NO_ENGINE_SUBSTITUTION"

  nginx:
    container_name: nginx_container
    pull_policy: build
    build:
      context: ./nginx
    networks:
      - app
    ports:
      - "80:80"
    depends_on:
      - mongodb
      - mysqldb
      - backend
      - frontend
  mongodb:
    container_name: mongodb_container
    image: mongo:jammy
    restart: always
    networks:
      - app
    volumes:
      - mongodb_data:/data/db

  # PostgreSQL Container for Keycloak
  postgres-kc:
    image: postgres:14-alpine
    environment:
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
      POSTGRES_DB: keycloakDB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    restart: unless-stopped
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - app    
  
  # Keycloak local server
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: token-exchange
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres-kc/keycloakDB"
      KC_DB_USERNAME: $POSTGRES_USER
      KC_DB_PASSWORD: $POSTGRES_PASSWORD
      KEYCLOAK_ADMIN: $KEYCLOAK_ADMIN_USER
      KEYCLOAK_ADMIN_PASSWORD: $KEYCLOAK_ADMIN_PASSWORD
    command:
      - "start"
      - "--http-enabled=true"
      - "--http-port=8080"
      - "--proxy=edge"
      - "--hostname-strict=false"
      - "--hostname=localhost"
      - "--hostname-strict-https=false"
      - "--hostname-path=/keycloak"
      - "--http-relative-path=/keycloak"
    restart: unless-stopped
    networks:
      - app
      - kinrw
    ports:
      - "8093:8080"       

    volumes:
      - ./keycloak/kcthemes:/opt/keycloak/themes

volumes:
  keycloak_postgres_data:
    driver: local
  mongodb_data:


networks:
  app:
    driver: bridge

  kinrw: